services:
  - type: worker
    name: agentball-event-worker
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm ci
    startCommand: npm run event-worker
    autoDeploy: true
    envVars:
      - key: AGENTBALL_EVENT_ENDPOINT
        value: https://agenty.cloud/api/cron/event-round
      - key: AGENTBALL_EVENT_ROUND_SECONDS
        value: "60"
      - key: AGENTBALL_EVENT_IDLE_SECONDS
        value: "10"
      - key: CRON_SECRET
        sync: false
